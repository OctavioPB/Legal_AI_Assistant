# Blocking checks for every pull request. The suite never reaches a provider: sockets are disabled
# except loopback and the model, embedder and reranker are fakes (.claude/rules/style.md).
# Not here on purpose: `app.doctor` and the golden suite need the local model runtime (Ollama);
# they are run by hand and their run ids go in the pull request description.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests on real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types (mypy --strict over app/)
        run: uv run mypy app

      - name: Prompt versions match their pinned hashes
        run: uv run python -m app.prompts.composer verify

      # The same infrastructure as development: pgvector image, the four roles from docker/initdb.
      - name: Start Postgres and Redis
        run: docker compose up -d --wait postgres redis

      # First and alone, so a leak is the first thing a reviewer sees.
      - name: Tenant isolation and jurisdiction pre-filter
        run: uv run pytest tests/test_tenant_isolation.py tests/test_jurisdiction_predicate.py

      - name: Full test suite
        run: uv run pytest

      - name: Postgres logs on failure
        if: failure()
        run: docker compose logs postgres | tail -n 200

  web:
    name: Web (types, guards, build, browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      # Catalog parity (es-MX / en-US), no hardcoded user-facing literals, no external URLs,
      # brand tokens and contrast.
      - name: Unit guards
        run: npm test

      - name: Build
        run: npm run build

      # The interface in a real browser against an API that is unreachable on purpose:
      # i18n, accessibility (axe), CSP, keyboard. Uses the Edge installed on the runner.
      - name: Browser checks
        env:
          API_URL: http://127.0.0.1:8999
          BASE_URL: http://127.0.0.1:3101
        run: |
          npx next start -H 127.0.0.1 -p 3101 &
          for i in $(seq 1 30); do curl -sf -o /dev/null "$BASE_URL/login" && break; sleep 1; done
          npm run e2e
