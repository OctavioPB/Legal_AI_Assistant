    alias: drafting-primary
    model_id: claude-opus-5-5
    verified_on: '2026-11-09'
    source_url: https://platform.claude.com/docs/en/about-claude/models/overview.md
    context_window: 1000000
    max_answer_tokens: 4096
    fallbacks: []
