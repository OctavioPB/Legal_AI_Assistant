# Remote model profile `claude` (ADR-024). Pinned from the provider's documentation, not from memory:
# https://platform.claude.com/docs/en/about-claude/models/overview.md (read 2026-11-09):
#   Claude Opus 5.5 - Claude API ID `claude-opus-5-5` (a dateless id that is itself a pinned snapshot),
#   1M-token context window, 128K max output, adaptive thinking always on, default effort `medium`.
# Every alias resolves to the same model; there are no fallbacks: a remote failure is never answered by a
# different model (local or remote) in the middle of a conversation. max_answer_tokens is the ANSWER cap;
# the client adds `anthropic_thinking_headroom_tokens` because thinking counts toward max_tokens.
aliases:
