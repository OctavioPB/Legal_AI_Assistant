[project]
name = "legal-ai-assistant"
version = "0.1.0"
description = "Multi-tenant legal research SaaS: verifiable citations, hard jurisdiction pre-filtering, structured refusal"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pgvector>=0.3.6",
    "docling>=2.148.0",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "pyjwt>=2.15.1",
    "pytesseract>=0.3.13",
    "pypdfium2>=5.15",
    "pillow>=12",
    "lxml>=6.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-socket>=0.7",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.uv]
package = false   # `app` is run from the repo root, not installed

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Network is blocked except loopback (Postgres/Redis in docker compose); providers are always fakes (style.md).
addopts = "--disable-socket --allow-hosts=127.0.0.1,localhost,::1 -m 'not live'"
markers = ["live: reaches real providers; never in default CI"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# `›` is the breadcrumb separator of legal hierarchy paths (rag.md).
allowed-confusables = ["›", "–", " "]  # legal text: dashes and nbsp are real input

[tool.mypy]
strict = true
packages = ["app"]
plugins = []

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ADR-030: the OCR path; none of these ship type information. Their use is confined to
# app/ingestion/ocr.py and pdf_read.py.
module = ["pypdfium2", "pypdfium2.*", "pytesseract", "pytesseract.*", "lxml", "lxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ADR-024: the Claude profile's SDK is installed only by a firm that enables it (`uv add anthropic`).
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# SQL strings and test tables read better unwrapped.
"app/db/migrations/versions/*.py" = ["E501"]
"app/db/models.py" = ["E501"]
"tests/*.py" = ["E501", "RUF012", "SIM117", "S608"]
# imports the `corpus` fixture from test_retrieval and uses it as a parameter name
"tests/test_chat_service.py" = ["F811"]
"tests/test_api.py" = ["F811"]
"tests/test_conversations.py" = ["F811"]  # pytest fixtures imported by name
"tests/test_lawyer_features.py" = ["F811"]  # pytest fixtures imported by name
"tests/test_explicit_reference.py" = ["F811"]  # pytest fixtures imported by name
"tests/test_model_profiles.py" = ["F811", "RUF028", "RUF059", "E501"]  # fixtures by name; table-style dicts
"app/doctor.py" = ["E501"]
"evals/probes/make_probes.py" = ["E501"]
"evals/run.py" = ["E501", "RUF028"]  # report lines read better unwrapped
"evals/review_sheet.py" = ["E501"]
"evals/golden.py" = ["E501"]
"tests/evals/*.py" = ["E501"]
"evals/calibrate_tau.py" = ["E501", "RUF028"]  # report lines read better unwrapped  # one check per line reads better than wrapped message strings
